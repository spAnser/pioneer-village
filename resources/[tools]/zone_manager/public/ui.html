<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="style.css">
    <title>Zone Manager</title>
</head>
<body>
    <div id="app" :class="{ show }">
        <div class="window window--left">
            <h1>Points ({{ points.length }})</h1>
            <p class="hint" v-if="cursor">Next: {{ round(cursor.x) }}, {{ round(cursor.y) }}, {{ round(cursor.z) }} <span class="key-hint">[F]</span></p>
            <ol>
                <template v-for="(point, index) of points">
                    <li :key="index" :class="{ nearest: index === nearestIndex }"
                        @mouseenter="hoverPoint(index)" @mouseleave="hoverPoint(null)">
                        [{{ index }}] {{ round(point.x) }}, {{ round(point.y) }}, {{ round(point.z) }}
                        <span class="remove" @click="deletePoint(index)">&times;</span>
                    </li>
                </template>
            </ol>
            <div class="button-grid">
                <button @click="addPoint">Add Point (here)</button>
                <button :disabled="!points.length" @click="undoPoint">Undo</button>
                <button :disabled="!points.length" @click="clearPoints">Clear</button>
            </div>
        </div>
        <div class="window window--right">
            <h1>Bounds</h1>
            <p class="hint">Set once from your position when the editor opens.</p>
            <div class="input-row">
                <label>
                    <span>Min Z</span>
                    <input type="number" v-model="minZ" step="0.5" @change="setBounds">
                </label>
                <label>
                    <span>Max Z</span>
                    <input type="number" v-model="maxZ" step="0.5" @change="setBounds">
                </label>
            </div>
            <h1>Export</h1>
            <button :disabled="points.length < 3" @click="refreshExport">Generate</button>
            <p v-if="points.length < 3" class="hint">Add at least 3 points to export a polygon.</p>
            <template v-if="exportData">
                <div class="label-row">
                    <span>TypeScript</span>
                    <button class="copy-button" @click="copyText(exportData.ts, $event)">Copy</button>
                </div>
                <textarea rows="12" readonly ref="tsExport">{{ exportData.ts }}</textarea>
                <div class="label-row">
                    <span>Lua</span>
                    <button class="copy-button" @click="copyText(exportData.lua, $event)">Copy</button>
                </div>
                <textarea rows="12" readonly ref="luaExport">{{ exportData.lua }}</textarea>
            </template>
        </div>
    </div>
    <script src="vue.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
